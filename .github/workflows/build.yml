name: DLL testing

on: [push, pull_request, workflow_dispatch]

jobs:
  cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          args: "-G \"Unix Makefiles\""
          nm: 1

        - os: windows-2025
          args: "-G \"Unix Makefiles\""
          nm: 1

        - os: windows-2025
          args: "-G \"Visual Studio 17 2022\""
          dumpbin: 1

    steps:
    - uses: actions/checkout@v4
    - name: system info
      run: |
        cmake -h
        cmake --system-information

    - name: CMake Gen
      run: cmake ${{ matrix.args }} -S . -B build

    - name: CMake Build
      run: cmake --build build -v --

    - name: Result
      shell: bash
      run: find build -type f

    - name: NM
      if: matrix.nm
      shell: bash
      run: nm --extern-only -g build/*.so*

    - name: dumpbin
      if: matrix.dumpbin
      shell: bash
      run: dumpbin build/*.dll
